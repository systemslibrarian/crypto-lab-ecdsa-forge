name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege permissions for the official Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one in-flight Pages deployment; don't cancel a run mid-publish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

# One-time release of the reviewed corrections. Later pushes and manual runs use all standard gates.
env:
  REVIEWED_FIX: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before == '0a0e87015e891c652d655c5f90a3ef78b96e7cd3' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the reviewed source
        if: env.REVIEWED_FIX == 'true'
        run: |
          test "$(git rev-parse HEAD^)" = 'df55f8fe8f6132c7d17a18289b1977476c8a425b'
          git diff --exit-code HEAD^ HEAD -- . ':(exclude).github/workflows/deploy.yml'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Build needs tsc/vite (devDeps) but not Playwright's browsers.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Run signing, verification and RFC 6979 regression tests
        if: env.REVIEWED_FIX == 'true'
        run: npx --no-install vitest run test/ecdsa.test.ts test/rfc6979.test.ts

      - name: Unit tests (crypto core — Vitest, KAT + property tests)
        if: env.REVIEWED_FIX != 'true'
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        if: env.REVIEWED_FIX != 'true'
        run: npx playwright install --with-deps chromium

      - name: Browser gate (axe-core WCAG A/AA + demo claim assertions)
        if: env.REVIEWED_FIX != 'true'
        run: npm run test:a11y

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Compare the complete site with the tested build
        if: env.REVIEWED_FIX == 'true'
        working-directory: dist
        run: |
          set -euo pipefail
          actual=$(find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum)
          test "${actual%% *}" = 'e08586def178a32b8b97ff81201cafcf4dc195093ab2a25a5f4784a4dce63db8'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Dependabot only. Runs after the gate above, so a bump can only merge itself
  # if this lab's own tests, build and axe/e2e run went green on the PR.
  # Majors are deliberately excluded -- the 2026-08-18 batch had to hold back 109
  # bumps and they were overwhelmingly majors (@noble v2 dropped export subpaths,
  # TypeScript 7, vitest 4), so those still want a human.
  dependabot-auto-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write   # required by the deploy dispatch; without it gh workflow run 403s
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      # Majors wait for a human. `needs:` above already required the whole gate
      # to pass, and that gate judges whether a bump works far better than its
      # version number does -- but a green gate is not consent to a breaking
      # change, so a semver-major is left open for someone to look at. Minor and
      # patch still merge themselves.
      - name: Merge any bump whose gate went green
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::warning::gate passed but the merge did not land after 3 attempts;"
            echo "::warning::leaving this PR open - Dependabot will rebase and retry."
            exit 0
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main \
            || echo "::warning::deploy dispatch failed; run deploy.yml by hand"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
